name: Repository integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python setup/check_repository.py
      - run: python -m unittest discover -s tests/test_fritzing -p 'test_*.py' -v
# Full native CAD/EDA acceptance: run bash setup/verify.sh --full inside the
# published workbench. It deliberately does not reinstall engineering apps in CI.
